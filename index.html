<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kenali Ubat Anda</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #F4F0F7;
            --panel: #FFFFFF;
            --ink: #261D2E;
            --ink-soft: #62596B;
            --teal: #75509A;
            --teal-dark: #50366E;
            --amber: #D98E2B;
            --amber-soft: #F6E3C4;
            --line: #D7CBE2;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            font-family: 'IBM Plex Sans', sans-serif;
            background: var(--bg);
            color: var(--ink);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .screen {
            width: 100%;
            max-width: 1200px;
            text-align: center;
        }

        .screen.hidden {
            display: none;
        }

        .screen h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--teal-dark);
            margin: 0 0 20px;
        }

        button {
            font-family: 'IBM Plex Sans', sans-serif;
            font-weight: 600;
            font-size: 14px;
            border: 1px solid var(--teal);
            background: var(--teal);
            color: #fff;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover:not(:disabled) {
            background: var(--teal-dark);
            border-color: var(--teal-dark);
        }

        button:disabled {
            background: var(--line);
            border-color: var(--line);
            color: var(--ink-soft);
            cursor: not-allowed;
        }

        button.ghost {
            background: transparent;
            color: var(--teal);
        }

        button.ghost:hover:not(:disabled) {
            background: var(--teal);
            color: #fff;
        }

        #mainMenu button {
            font-size: 16px;
            padding: 14px 36px;
        }

        .level-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .level {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 4px;
            padding: 18px 20px;
            width: min(100%, 300px);
            flex: 1 1 220px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .level h2 {
            margin: 0;
            font-size: 17px;
            font-weight: 600;
            color: var(--teal-dark);
        }

        .level p {
            margin: 0;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            color: var(--ink-soft);
        }

        .level button {
            width: 100%;
            margin-top: 4px;
        }

        hr {
            border: none;
            border-top: 1px solid var(--line);
            margin: 20px auto;
            max-width: 500px;
        }

        #bossBtn {
            font-size: 15px;
            padding: 12px 28px;
        }

        #bossBtn:not(:disabled) {
            background: var(--amber);
            border-color: var(--amber);
        }

        #bossBtn:not(:disabled):hover {
            background: #c07f24;
            border-color: #c07f24;
        }
    </style>
</head>

<body>

    <div id="mainMenu" class="screen">
        <h1>Kenali Ubat Anda</h1>
        <audio id="backgroundMusic" preload="auto" loop>
            <source src="assets/sound/bckgrd.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
        <button onclick="showHub()">Mula</button>
    </div>

    <div id="hub" class="screen hidden">
        <h1>Sila Pilih Cabaran</h1>

        <div class="level-container">
            <div class="level">
                <h2>Memori</h2> <!-- Use 'A Brand New Start - TrackTribe' Audio  -->
                <p id="status1">Belum Selesai</p>
                <button onclick="playLevel(1)">Mula</button>
            </div>

            <div class="level"> <!-- Use 'Scheming Weasel (faster version) – Kevin MacLeod' Audio  -->
                <h2>Cari Kata</h2>
                <p id="status2">Belum Selesai</p>
                <button onclick="playLevel(2)">Mula</button>
            </div>

            <div class="level">
                <h2>Susun Padan</h2> <!-- Use 'Computer Bounce - Geographer' Audio  -->
                <p id="status3">Belum Selesai</p>
                <button onclick="playLevel(3)">Mula</button>
            </div>
        </div>

        <hr>

        <button id="bossBtn" disabled onclick="playBoss()">
            Peringkat Bonus Dikunci!
        </button>

        <button class="ghost" style="margin-top: 20px;" onclick="resetProgress()">Set Semula Cabaran</button>

    </div>

    <script src="script.js"></script>

</body>

</html>
