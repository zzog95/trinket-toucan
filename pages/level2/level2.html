<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  <title>Pharmacy Word Search</title>
  <link rel="manifest" href="../../manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="level2.css">
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap"
    rel="stylesheet">
</head>

<body id="levelScreen" class="screen">
  <audio id="lvl2" preload="auto" loop autoplay>
    <source src="../../assets/sound/lvl2.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>
  <div class="app">
    <header>
      <div class="title-block">
        <h1>Tahap 2 - Cari Kata</h1>
        <p>Cari setiap istilah yang tersembunyi di dalam kisi. Pilih kata secara horizontal dari kiri ke kanan atau secara vertikal dari atas ke bawah.</p>
      </div>
      <div class="meta">
        <!-- <div><strong id="timer">00:00</strong></div> -->
        <div id="progress">0 / 0 ditemukan</div>
      </div>
    </header>

    <main>
      <div class="board-wrap">
        <div class="grid-stack">
          <div id="grid" role="grid" aria-label="Word search grid"></div>
          <svg id="highlight-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
        </div>
      </div>

      <div class="sidebar">
        <div class="panel">
          <h2>Cari istilah ini</h2>
          <ul id="wordlist"></ul>
        </div>
        <div class="panel">
          <button id="restart-btn">Mula Semula</button>
          <div><br></div>
          <button onclick="showHubFromOutside()">
            Kembali
          </button>
        </div>
      </div>
    </main>

    <div id="splashScreen">Tahap Selesai!</div>
  </div>

  <script src="level2.js"></script>
  <script src="../../script.js"></script>

</body>

</html>
