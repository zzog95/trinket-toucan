<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Level 1</title>
    <link rel="manifest" href="../../manifest.json">
    <link rel="stylesheet" href="../../style.css" />
    <link rel="stylesheet" href="level1.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap"
        rel="stylesheet">
</head>

<body id="levelScreen" class="screen">

    <!-- <h1 id="levelTitle"></h1> -->
    <audio id="lvl1" preload="auto" loop autoplay>
        <source src="../../assets/sound/lvl1.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <div class="app">

        <header>
            <div class="title-block">
                <h1>Tahap 1 - Memori</h1>
                <p>Padankan setiap pasangan berkaitan dengan Panduan Penyimpanan Ubat yang Selamat. Klik dua kad untuk
                    menerokannya.</p>
            </div>
        </header>
        <div id="game-board"></div>

        <!-- Modal -->
        <div id="info-modal">
            <div id="info-flex">
                <div id="info-content">
                    <div id="info-img"></div>
                    <div id="info-text"></div>
                    <button id="close-modal">Tutup</button>
                </div>
            </div>
        </div>

        <button class="back-btn" onclick="showHubFromOutside()">
            Kembali
        </button>
        <div id="splashScreen">Tahap Selesai!</div>
    </div>

    <script src="level1.js"></script>
    <script src="../../script.js"></script>

</body>

</html>
